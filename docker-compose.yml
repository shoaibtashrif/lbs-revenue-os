services:
  postgres:
    image: postgres:16-alpine
    container_name: lbs-postgres
    environment:
      POSTGRES_USER: lbs_user
      POSTGRES_PASSWORD: lbs_pass
      POSTGRES_DB: lbs_revenue_os
    ports:
      - "5432:5432"
    volumes:
      - lbs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lbs_user -d lbs_revenue_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lbs-redis
    ports:
      - "6379:6379"
    volumes:
      - lbs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lbs_postgres_data:
  lbs_redis_data:
